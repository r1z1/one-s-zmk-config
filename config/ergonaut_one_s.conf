CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=1800

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Required to enable the mouse-emulation behaviors (&mmv, &msc, &mkp) used
# in the MOUSE layer. Note: after flashing this the first time, you may
# need to "forget"/re-pair over BLE once so the host refreshes the HID
# descriptor and starts recognizing the new mouse endpoint.
CONFIG_ZMK_POINTING=y

# Smooths out scroll events instead of sending big discrete steps.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
